<text x="16" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" letter-spacing="1.5" fill="#f4f7f4">KROOLO + POLIGAP / PERFORMANCE</text>
<text x="16" y="84" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8c968f">API latency down 40% with Redis caching</text><text x="16" y="101" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8c968f">and N+1 fixes; PDF processing 80% faster</text><text x="16" y="118" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8c968f">with page-limited extraction.</text></g></g>
