<text x="16" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" letter-spacing="1.5" fill="#f4f7f4">QIVRA / DELIVERY</text>
<text x="16" y="84" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8c968f">348 app and 131 server tests, GitHub</text><text x="16" y="101" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8c968f">Actions builds and a tagged v2.0.0</text><text x="16" y="118" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8c968f">release under AGPL-3.0.</text></g></g>
