<text x="16" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" letter-spacing="1.5" fill="#f4f7f4">QIVRA / ARCHITECTURE</text>
<text x="16" y="84" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8c968f">Data stays on the device: SQLite (FTS5)</text><text x="16" y="101" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8c968f">vault, plus a durable job queue that</text><text x="16" y="118" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8c968f">retries with backoff and resumes after</text><text x="16" y="135" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8c968f">crashes or offline.</text></g></g>
